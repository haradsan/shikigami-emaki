<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>妖・陰陽師 肖像プレビュー</title>
<style>
  body { margin: 0; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; background: #e7dcc3; color: #1d1a17; }
  h1 { font-size: 18px; margin: 12px 16px 4px; }
  p.note { margin: 0 16px 10px; font-size: 12px; color: #5a5046; }
  section { padding: 12px 12px 18px; }
  section.paper { background: #f3e9d2; }
  section.dark { background: #1b1712; color: #efe4cc; }
  h2 { font-size: 15px; margin: 4px 4px 10px; font-weight: normal; letter-spacing: .1em; }
  h3 { font-size: 13px; margin: 14px 4px 6px; font-weight: normal; opacity: .75; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { display: flex; align-items: flex-end; gap: 8px; padding: 8px; border-radius: 8px; border: 1px solid rgba(128, 110, 80, .35); }
  .paper .cell { background: #f7efdd; }
  .dark .cell { background: #241f18; }
  .p72 { width: 72px; height: 72px; }
  .p160 { width: 160px; height: 160px; }
  .p72 svg, .p160 svg { width: 100%; height: 100%; display: block; }
  .frame { border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(90, 70, 40, .35); }
  .meta { font-size: 12px; line-height: 1.5; min-width: 70px; }
  .meta b { font-size: 14px; display: block; }
  .meta small { opacity: .6; font-family: monospace; }
  .err { color: #c8322a; font-weight: bold; }
</style>
</head>
<body>
<h1>妖・陰陽師 肖像プレビュー（js/art-yokai.js）</h1>
<p class="note" id="stat"></p>
<section class="paper"><h2>和紙色の地（#f3e9d2）</h2><div id="paper"></div></section>
<section class="dark"><h2>暗い地（#1b1712）</h2><div id="dark"></div></section>
<script src="../js/art-yokai.js"></script>
<script>
  const GROUPS = [
    ["小妖", [
      ["y_sunekajiri", "すねかじり"], ["y_sodehiki", "袖引き小僧"], ["y_hitotsume", "一つ目小僧"], ["y_azukiarai", "小豆洗い"],
      ["y_akaname", "垢嘗"], ["y_aobozu", "青坊主"], ["y_nobusuma", "野衾"], ["y_okurichochin", "送り提灯"],
      ["y_amefuri", "雨降り小僧"], ["y_tenjoname", "天井嘗"], ["y_bakezori", "化け草履"], ["y_mikoshi", "見越し入道"],
      ["y_dorotabo", "泥田坊"],
    ]],
    ["季節の大妖", [
      ["y_tsuchigumo", "土蜘蛛"], ["y_orochi", "八岐大蛇"], ["y_tamamo", "玉藻前"],
      ["y_ootakemaru", "大嶽丸"], ["y_gashadokuro", "がしゃどくろ"], ["y_sutoku", "崇徳院"],
    ]],
    ["百鬼夜行の主", [["y_nurarihyon", "ぬらりひょん"]]],
    ["陰陽師", [["o_hinata", "ひなた"], ["o_kuzunoha", "葛の葉"], ["o_douman", "道満"]]],
    ["未知の id", [["zzz_unknown", "（影法師）"]]],
  ];
  let total = 0, bytes = 0;
  const bad = [];
  function render(root) {
    let html = "";
    for (const [title, list] of GROUPS) {
      html += `<h3>${title}</h3><div class="grid">`;
      for (const [id, name] of list) {
        let s = "", count = 0;
        try {
          s = YokaiArt.svg(id);
          count = (s.match(/<(path|circle|ellipse|g|rect|polygon|line)\b/g) || []).length;
          if (/\sid=|<defs|url\(#|<text|Gradient|filter/.test(s)) bad.push(id);
        } catch (e) { s = `<span class="err">ERROR ${e.message}</span>`; bad.push(id); }
        if (root === "paper") { total++; bytes += s.length; }
        html += `<div class="cell"><div class="p72 frame">${s}</div><div class="p160 frame">${s}</div>` +
          `<div class="meta"><b>${name}</b><small>${id}<br>${count} 要素<br>has=${YokaiArt.has(id)}</small></div></div>`;
      }
      html += `</div>`;
    }
    document.getElementById(root).innerHTML = html;
  }
  render("paper");
  render("dark");
  document.getElementById("stat").textContent =
    `${total} 枠 / SVG合計 ${(bytes / 1024).toFixed(1)}KB / 規則違反: ${bad.length ? bad.join(", ") : "なし"}`;
</script>
</body>
</html>
