<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1712">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>式神絵巻 — 花札百鬼祓い</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- ?v= はキャッシュ避け。更新したら必ず番号を上げること（スマホは古い版を握り続ける） -->
<link rel="stylesheet" href="css/style.css?v=40">
</head>
<body>
<div id="app">

  <!-- ===== タイトル ===== -->
  <section id="scr-title" class="screen">
    <div class="title-sky">
      <div class="moon"></div>
      <div class="kasumi k1"></div><div class="kasumi k2"></div>
    </div>
    <div class="title-block">
      <div class="title-sub">花札百鬼祓い</div>
      <h1 class="title-main"><span>式</span><span>神</span><span>絵</span><span>巻</span></h1>
      <p class="title-flavor">季節の札を打ち、式神と共に<br>一年をかけて百鬼夜行を祓え</p>
    </div>
    <div id="parade" class="parade"></div>
    <div class="title-menu">
      <button id="btn-continue" class="btn big gold hidden">続きから</button>
      <button id="btn-new" class="btn big">はじめから</button>
      <div class="title-row">
        <button id="btn-book" class="btn">図鑑</button>
        <button id="btn-howto" class="btn">遊び方</button>
        <button id="btn-settings" class="btn">設定</button>
      </div>
    </div>
    <div class="title-foot">v40 ・ <a href="classic/" class="dim-link">旧版（盤上遊戯）</a></div>
  </section>

  <!-- ===== 陰陽師えらび ===== -->
  <section id="scr-select" class="screen">
    <header class="scr-head"><button class="btn icon back" data-back="title">‹</button><h2>陰陽師をえらぶ</h2></header>
    <div id="om-list" class="om-list"></div>
  </section>

  <!-- ===== 絵巻（月の地図） ===== -->
  <section id="scr-emaki" class="screen">
    <div class="topbar" id="emaki-top"></div>
    <div id="emaki-scroll" class="emaki-scroll"><div id="emaki-strip" class="emaki-strip"></div></div>
    <div id="emaki-panel" class="emaki-panel"></div>
  </section>

  <!-- ===== 祓い（対局） ===== -->
  <section id="scr-round" class="screen">
    <div class="topbar" id="round-top"></div>
    <div id="yokai-bar" class="yokai-bar"></div>
    <div id="shiki-row" class="shiki-row"></div>
    <div id="field" class="field">
      <div id="played" class="played"></div>
      <div id="calc" class="calc">
        <div id="yaku-chips" class="yaku-chips"></div>
        <div class="calc-box"><span id="c-bun" class="c-bun">0</span><span class="c-x">×</span><span id="c-bai" class="c-bai">0</span></div>
        <div id="c-total" class="c-total"></div>
      </div>
      <div id="toast-area" class="toast-area"></div>
      <div id="pile" class="pile"></div>
    </div>
    <div id="fu-row" class="fu-row"></div>
    <div id="hand" class="hand"></div>
    <div class="actions">
      <button id="btn-discard" class="btn act discard">流す<small id="n-discard"></small></button>
      <div class="sorters">
        <button id="btn-sort" class="btn small">月順</button>
        <button id="btn-deck" class="btn small">山札</button>
      </div>
      <button id="btn-play" class="btn act play">打つ<small id="n-play"></small></button>
    </div>
  </section>

  <!-- ===== 夜市 ===== -->
  <section id="scr-shop" class="screen">
    <div class="topbar" id="shop-top"></div>
    <div id="shop-shiki" class="shiki-row"></div>
    <div id="shop-fu" class="fu-row shop-furow"></div>
    <div class="shop-body" id="shop-body"></div>
    <div class="actions shop-actions">
      <button id="btn-reroll" class="btn act">めくり直し<small id="n-reroll"></small></button>
      <button id="btn-leave" class="btn act play">次の月へ ›</button>
    </div>
  </section>

  <!-- ===== 一年の終わり／結び ===== -->
  <section id="scr-end" class="screen">
    <div id="end-body" class="end-body"></div>
  </section>

  <!-- ===== 図鑑 ===== -->
  <section id="scr-book" class="screen">
    <header class="scr-head"><button class="btn icon back" data-back="title">‹</button><h2>図鑑</h2></header>
    <div class="tabs" id="book-tabs">
      <button class="tab on" data-tab="shiki">式神</button>
      <button class="tab" data-tab="yaku">役と歌</button>
      <button class="tab" data-tab="yokai">妖</button>
      <button class="tab" data-tab="fuda">札</button>
    </div>
    <div id="book-body" class="book-body"></div>
  </section>

</div>

<!-- 重ね窓（詳細・精算・文箱・遊び方など） -->
<div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
<div id="overlay" class="overlay hidden"></div>
<div id="fx-layer" class="fx-layer"></div>

<script src="js/data.js?v=40"></script>
<script src="js/score.js?v=40"></script>
<script src="js/run.js?v=40"></script>
<script src="js/art-hana.js?v=40"></script>
<script src="js/art-shiki.js?v=40"></script>
<script src="js/art-yokai.js?v=40"></script>
<script src="js/art.js?v=40"></script>
<script src="js/bgm.js?v=40"></script>
<script src="js/sfx.js?v=40"></script>
<script src="js/profile.js?v=40"></script>
<script src="js/ui.js?v=40"></script>
<script src="js/main.js?v=40"></script>
<script>
  // 開発用: ?sim=1 のときだけ検証ボットを読み込む
  if (/[?&]sim=1/.test(location.search)) { const s = document.createElement("script"); s.src = "js/sim.js?v=" + Date.now(); document.body.appendChild(s); }
</script>
</body>
</html>
